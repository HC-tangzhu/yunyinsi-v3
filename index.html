<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>云隐寺 · 调试版</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0b0e14;font-family:"PingFang SC","Microsoft YaHei",sans-serif;user-select:none;touch-action:none;}
  #app{position:fixed;inset:0;}
  canvas{display:block;}
  .hud{position:fixed;top:calc(8px + env(safe-area-inset-top));left:8px;right:8px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;z-index:10;}
  .hud .box{background:rgba(255,246,230,.9);border:3px solid #c0392b;border-radius:12px;padding:5px 12px;color:#c0392b;font-weight:800;font-size:13px;box-shadow:0 3px 10px rgba(0,0,0,.25);}
  .hud .box .num{font-size:18px;}
  .hud .title{border-color:#d99a3a;color:#a86b1c;text-align:right;font-size:12px;}
  .hud .title small{font-size:9px;color:#b98a3e;display:block;}
  .minimap{position:fixed;right:8px;top:70px;width:120px;height:120px;background:rgba(255,246,230,.45);border:3px solid rgba(192,57,43,.6);border-radius:10px;z-index:12;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.2);transition:all .25s;opacity:0.75;}
  .minimap.hide{width:44px;height:44px;border-radius:50%;opacity:1;}
  .minimap canvas{width:100%;height:100%;display:block;}
  .minimap.hide canvas{display:none;}
  .minimap .label{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:9px;color:#7a4a2b;font-weight:700;background:rgba(255,246,230,.7);}
  .minimap.hide .label{display:none;}
  .minimap .toggle{position:absolute;left:0;top:0;width:100%;height:100%;display:none;align-items:center;justify-content:center;font-size:22px;color:#c0392b;cursor:pointer;}
  .minimap.hide .toggle{display:flex;}
  .joystick{position:fixed;left:20px;bottom:calc(24px + env(safe-area-inset-bottom));width:130px;height:130px;border-radius:50%;background:rgba(255,255,255,.18);border:2px solid rgba(255,255,255,.4);z-index:20;touch-action:none;}
  .joystick .stick{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:rgba(255,246,230,.92);box-shadow:0 3px 10px rgba(0,0,0,.3);transition:transform .04s;}
  
  /* 修改了这里：抬高位置，增加最高层级 */
  .interact{position:fixed;right:15px;bottom:calc(160px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;z-index:9999 !important;align-items:flex-end;pointer-events:auto !important;}
  
  .interact button{min-width:84px;height:70px;padding:0 10px;border-radius:16px;border:none;font-size:12px;font-weight:800;color:#fff;background:#c0392b;box-shadow:0 5px 0 #8f2a20,0 6px 16px rgba(0,0,0,.3);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;opacity:0;transform:scale(.6);pointer-events:none;transition:all .15s;}
  .interact button .ico{font-size:22px;}
  .interact button.show{opacity:1;transform:scale(1);pointer-events:auto;}
  .interact button:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 #8f2a20;}
  .interact button.gold{background:#d99a3a;box-shadow:0 5px 0 #a86b1c,0 6px 16px rgba(0,0,0,.3);}
  .interact button.green{background:#5a9e4a;box-shadow:0 5px 0 #3f7533,0 6px 16px rgba(0,0,0,.3);}
  .interact button.always{opacity:1;transform:scale(1);pointer-events:auto;}
  .toast{position:fixed;left:50%;top:20%;transform:translateX(-50%) translateY(-10px);background:rgba(192,57,43,.94);color:#fff;padding:8px 18px;border-radius:18px;font-size:13px;font-weight:700;z-index:30;opacity:0;pointer-events:none;transition:all .25s;white-space:nowrap;max-width:90vw;text-align:center;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .float{position:fixed;font-size:19px;font-weight:900;color:#ffd76a;text-shadow:0 2px 6px rgba(0,0,0,.7);pointer-events:none;z-index:25;animation:floatUp 1s ease-out forwards;}
  @keyframes floatUp{0%{opacity:1;transform:translateY(0) scale(.8);}30%{transform:translateY(-24px) scale(1.2);}100%{opacity:0;transform:translateY(-90px) scale(1);}}
  .loading{position:fixed;inset:0;background:#0b0e14;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ffd76a;gap:14px;z-index:100;transition:opacity .6s;}
  .loading.hide{opacity:0;pointer-events:none;}
  .loading .lotus{font-size:46px;animation:spin 2s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{font-size:14px;letter-spacing:2px;}
  .loading .bar{width:160px;height:6px;background:#333;border-radius:3px;overflow:hidden;}
  .loading .bar i{display:block;height:100%;width:0;background:#ffd76a;transition:width .3s;}
  .lookhint{position:fixed;right:8px;top:50%;transform:translateY(-50%);color:rgba(255,255,255,.5);font-size:10px;writing-mode:vertical-rl;letter-spacing:2px;z-index:5;pointer-events:none;}
  .modal-mask{position:fixed;inset:0;background:rgba(40,20,8,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:16px;}
  .modal-mask.show{display:flex;}
  .modal{background:#fff6e6;border:4px solid #c0392b;border-radius:20px;padding:16px;width:100%;max-width:360px;max-height:82vh;overflow-y:auto;text-align:center;box-shadow:0 12px 30px rgba(0,0,0,.35);animation:pop .22s ease-out;}
  @keyframes pop{from{transform:scale(.85);opacity:0;}to{transform:scale(1);opacity:1;}}
  .modal h3{color:#c0392b;font-size:17px;margin-bottom:8px;}
  .modal p{color:#7a4a2b;font-size:13px;line-height:1.7;margin-bottom:8px;}
  .modal .qianwen{font-size:15px;font-weight:800;color:#a86b1c;margin:8px 0;}
  .modal .jieda{background:#fdeccd;border-radius:12px;padding:10px;color:#7a4a2b;font-size:12px;line-height:1.7;text-align:left;margin-top:6px;}
  .modal textarea,.modal input[type=text]{width:100%;border:2px solid #d99a3a;border-radius:10px;padding:8px;font-size:13px;font-family:inherit;color:#7a4a2b;outline:none;resize:none;}
  .modal textarea{height:60px;}
  .modal .btns{display:flex;gap:8px;margin-top:10px;}
  .modal .btns button{flex:1;border:none;border-radius:11px;padding:10px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;}
  .btn-primary{background:#c0392b;color:#fff;box-shadow:0 4px 0 #8f2a20;}
  .btn-primary:active{transform:translateY(3px);box-shadow:0 1px 0 #8f2a20;}
  .btn-ghost{background:#e8d4b0;color:#7a4a2b;box-shadow:0 4px 0 #c8ae82;}
  .btn-ghost:active{transform:translateY(3px);box-shadow:0 1px 0 #c8ae82;}
  .divine-menu{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0;}
  .divine-menu button{background:#fdeccd;border:2px solid #d99a3a;border-radius:12px;padding:14px 6px;font-size:13px;font-weight:800;color:#7a4a2b;cursor:pointer;font-family:inherit;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .divine-menu button .ic{font-size:24px;}
  .divine-menu button:active{background:#f2d9a8;}
  .quiz-q{font-size:14px;font-weight:700;color:#7a4a2b;margin:10px 0;line-height:1.6;text-align:left;}
  .quiz-opts{display:flex;flex-direction:column;gap:6px;}
  .quiz-opts button{background:#fdeccd;border:2px solid #d99a3a;border-radius:10px;padding:10px;font-size:13px;font-weight:700;color:#7a4a2b;cursor:pointer;font-family:inherit;text-align:left;}
  .quiz-opts button:active{background:#f2d9a8;}
  .quiz-progress{font-size:11px;color:#b98a3e;margin-bottom:6px;}
  .task-card{background:#fdeccd;border-radius:12px;padding:12px;margin:8px 0;text-align:left;}
  .task-card .tname{font-size:14px;font-weight:800;color:#a86b1c;margin-bottom:6px;}
  .task-card .tdesc{font-size:12px;color:#7a4a2b;line-height:1.5;}
  .task-bar{height:10px;background:#e8d4b0;border-radius:5px;overflow:hidden;margin-top:8px;}
  .task-bar i{display:block;height:100%;width:0;background:#5a9e4a;transition:width .3s;}
  .chat-log{height:160px;overflow-y:auto;background:#fdeccd;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;margin-bottom:8px;text-align:left;}
  .msg{max-width:82%;padding:7px 10px;border-radius:12px;font-size:12px;line-height:1.5;}
  .msg.bot{align-self:flex-start;background:#fff;color:#5a3218;border-bottom-left-radius:3px;}
  .msg.me{align-self:flex-end;background:#c0392b;color:#fff;border-bottom-right-radius:3px;}
  .chat-input-row{display:flex;gap:6px;}
  .chat-input-row input{flex:1;border:2px solid #d99a3a;border-radius:9px;padding:8px;font-size:13px;font-family:inherit;color:#7a4a2b;outline:none;}
  .chat-input-row button{border:none;background:#c0392b;color:#fff;border-radius:9px;padding:0 14px;font-weight:800;cursor:pointer;}
  .copy-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;margin:10px 0;}
  .copy-grid button{background:#fdeccd;border:2px solid #d99a3a;border-radius:6px;padding:6px;font-size:14px;font-weight:700;color:#7a4a2b;cursor:pointer;font-family:inherit;}
  .copy-grid button:disabled{background:#c0392b;color:#fff;}
  .rank-list{max-height:280px;overflow-y:auto;margin:8px 0;}
  .rank-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:#fdeccd;margin-bottom:5px;font-size:13px;text-align:left;}
  .rank-item.me{background:#ffe08a;border:2px solid #d99a3a;font-weight:800;}
  .rank-item .rk{width:26px;font-weight:900;color:#c0392b;}
  .rank-item .nm{flex:1;color:#5a3218;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .rank-item .mt{color:#a86b1c;font-weight:800;}
  .debug{position:fixed;left:8px;top:100px;background:rgba(0,0,0,.8);color:#0f0;font-size:11px;padding:6px 8px;border-radius:8px;z-index:99;font-family:monospace;line-height:1.5;pointer-events:none;max-width:70vw;}
</style>
</head>

<body>
<div id="app"></div>
<div class="hud">
  <div class="box">🪷 功德 <span class="num" id="meritNum">0</span></div>
  <div class="box title"><span id="titleName">小沙弥</span><small>修行等级</small></div>
</div>
<div class="minimap" id="minimap"><canvas id="mapCanvas"></canvas><div class="label" id="mapLabel">山门</div><div class="toggle" id="mapToggle">🗺️</div></div>
<div class="lookhint">右侧滑动转视角</div>
<div class="debug" id="debugPanel">加载中…</div>
<div class="joystick" id="joystick"><div class="stick" id="stick"></div></div>
<div class="interact">
  <button id="btnRank" class="green always"><span class="ico">🏆</span>排行榜</button>
  <button id="btnMuyu" class="gold"><span class="ico">🪵</span>敲木鱼</button>
  <button id="btnBow"><span class="ico">🙏</span>跪拜</button>
  <button id="btnIncense"><span class="ico">🕯️</span>上香</button>
  <button id="btnNPC" class="green"><span class="ico">💬</span>交谈</button>
  <button id="btnWish" class="gold"><span class="ico">🌳</span>许愿</button>
  <button id="btnRelease" class="green"><span class="ico">🐟</span>放生</button>
  <button id="btnLight" class="gold"><span class="ico">🏮</span>供灯</button>
  <button id="btnCopy" class="green"><span class="ico">📜</span>抄经</button>
  <button id="btnDivine" class="gold"><span class="ico">🔮</span>问卜</button>
</div>
<div class="toast" id="toast"></div>
<div class="loading" id="loading"><div class="lotus">🪷</div><p>正在推演天机…</p><div class="bar"><i id="loadBar"></i></div></div>
<div class="modal-mask" id="mask"><div class="modal" id="modalBox"></div></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js" } }
</script>

<script type="module">
import * as THREE from 'three';

/* ================= 基础 ================= */
const app=document.getElementById('app');
const scene=new THREE.Scene();
scene.background=new THREE.Color(0xffe6bf);
scene.fog=new THREE.Fog(0xffe0b0, 30, 60);
const camera=new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xfff4e0,0x88aa66,0.9));
const sun=new THREE.DirectionalLight(0xfff0d0,1.3);
sun.position.set(14,22,12); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-30,right:30,top:30,bottom:-30,far:70});
scene.add(sun);
scene.add(new THREE.AmbientLight(0xffffff,0.3));

/* ================= 工具 ================= */
const mat=(c,o={})=>new THREE.MeshStandardMaterial({color:c,flatShading:false,roughness:0.8,metalness:0.05,...o});
const RED=0xc0392b,GOLD=0xe8b04a,WOOD=0xa8743e,CREAM=0xf6e7c8,GREEN=0x7fb069,DARK=0x5a3218,STONE=0xd8c6a0,SKIN=0xf7d27a,WALL=0xe8c87a;
function box(w,h,d,c,x,y,z,p){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m;}
function cyl(rt,rb,h,s,c,x,y,z,p){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,s),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m;}
function sph(r,s,c,x,y,z,p){const m=new THREE.Mesh(new THREE.SphereGeometry(r,s,Math.max(10,s)),mat(c));m.position.set(x,y,z);m.castShadow=m.receiveShadow=true;(p||scene).add(m);return m;}
function roof(w,h,d,c,x,y,z,p){const g=new THREE.Mesh(new THREE.ConeGeometry(1,1,4),mat(c));g.scale.set(w,h,d);g.position.set(x,y,z);g.rotation.y=Math.PI/4;g.castShadow=true;(p||scene).add(g);return g;}
function plaque(text,w,c,x,y,z,p){
  const cv=document.createElement('canvas');cv.width=512;cv.height=128;
  const cc=cv.getContext('2d');cc.fillStyle=c||'#3a2210';cc.fillRect(0,0,512,128);
  cc.strokeStyle='#e8b04a';cc.lineWidth=8;cc.strokeRect(6,6,500,116);
  cc.fillStyle='#f2c96b';cc.font='bold 76px serif';cc.textAlign='center';cc.textBaseline='middle';
  cc.fillText(text,256,68);
  const tex=new THREE.CanvasTexture(cv);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,w/4,0.12),new THREE.MeshStandardMaterial({map:tex,roughness:0.8}));
  m.position.set(x,y,z);(p||scene).add(m);return m;
}

/* ================= 场景 ================= */
const ground=new THREE.Mesh(new THREE.CircleGeometry(40,64),mat(0x9cc286,{roughness:1}));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true; scene.add(ground);
function wallSeg(x1,z1,x2,z2){
  const dx=x2-x1,dz=z2-z1,len=Math.hypot(dx,dz);
  const g=new THREE.Group();g.position.set((x1+x2)/2,0,(z1+z2)/2);g.rotation.y=Math.atan2(dx,dz);scene.add(g);
  box(0.5,2.2,len,WALL,0,1.1,0,g);
  box(0.9,0.3,len+0.3,0x6a4a2a,0,2.35,0,g);
}
wallSeg(-26,32,-5,32); wallSeg(5,32,26,32);
wallSeg(-26,32,-26,-30); wallSeg(26,32,26,-30);
wallSeg(-26,-30,26,-30);
const gate=new THREE.Group();gate.position.set(0,0,32);scene.add(gate);
for(const sx of [-1,1]){cyl(0.4,0.45,4.5,10,RED,sx*3,2.25,0,gate);box(0.9,0.5,0.9,STONE,sx*3,4.6,0,gate);}
box(7.6,0.5,0.9,RED,0,4.9,0,gate);
roof(5,1.4,2.2,RED,0,5.8,0,gate);
plaque('云隐寺',3,'#3a2210',0,4.3,0.55,gate);
for(let i=0;i<24;i++){box(2.8,0.06,1.2,STONE,0,0.03,30-i*1.3);}

/* ================= 可透明建筑 ================= */
const buildings=[];
function houseWithDoor(w,d,h,wallColor,doorW,doorH,x,z,name,roofColor){
  const g=new THREE.Group();g.position.set(x,0,z);scene.add(g);
  box(w+0.6,0.4,d+0.6,STONE,0,0.2,0,g);
  const halfW=w/2, halfD=d/2, sideW=(w-doorW)/2;
  const walls=[];
  walls.push(box(w,h,0.3,wallColor,0,0.4+h/2,-halfD,g));
  walls.push(box(0.3,h,d,wallColor,-halfW,0.4+h/2,0,g));
  walls.push(box(0.3,h,d,wallColor,halfW,0.4+h/2,0,g));
  walls.push(box(sideW,h,0.3,wallColor,-(doorW/2+sideW/2),0.4+h/2,halfD,g));
  walls.push(box(sideW,h,0.3,wallColor,doorW/2+sideW/2,0.4+h/2,halfD,g));
  walls.push(box(doorW,h-doorH,0.3,wallColor,0,0.4+doorH+(h-doorH)/2,halfD,g));
  box(doorW+0.3,0.25,0.35,0x6a3a1a,0,0.4+doorH,halfD,g);
  box(0.25,doorH+0.25,0.35,0x6a3a1a,-doorW/2,0.4+doorH/2,halfD,g);
  box(0.25,doorH+0.25,0.35,0x6a3a1a,doorW/2,0.4+doorH/2,halfD,g);
  box(doorW+0.2,0.12,0.5,0x8a5a2a,0,0.46,halfD,g);
  box(doorW/2-0.05,doorH-0.1,0.08,0x9a4a2a,-(doorW/2-0.15),0.4+doorH/2,halfD-0.15,g).rotation.y=Math.PI/2;
  box(doorW/2-0.05,doorH-0.1,0.08,0x9a4a2a,(doorW/2-0.15),0.4+doorH/2,halfD-0.15,g).rotation.y=-Math.PI/2;
  const r1=roof(w+2,2,d+2,roofColor||RED,0,0.4+h+0.9,0,g);
  const r2=roof(w*0.7,1.6,d*0.7,roofColor||RED,0,0.4+h+2,0,g);
  sph(0.4,10,GOLD,0,0.4+h+2.7,0,g);
  plaque(name,Math.min(3.5,doorW+0.6),'#3a2210',0,0.4+h-0.5,halfD+0.2,g);
  buildings.push({group:g,walls,roofs:[r1,r2],cx:x,cz:z,rx:w/2+1.5,rz:d/2+1.5,transparent:false});
  return g;
}

/* ================= 大雄宝殿 ================= */
const hall=houseWithDoor(16,12,5,CREAM,4.5,3.8,0,-2,'大雄宝殿',RED);
const buddha=new THREE.Group();buddha.position.set(0,0.5,-3.5);hall.add(buddha);
sph(1.3,18,GOLD,0,0.9,0,buddha);
sph(0.75,20,SKIN,0,2.4,0,buddha);
sph(0.3,10,DARK,0,2.95,0,buddha);
for(const x of [-0.28,0.28])sph(0.09,8,DARK,x,2.45,0.65,buddha);
const smile=new THREE.Mesh(new THREE.TorusGeometry(0.18,0.03,6,14,Math.PI),mat(DARK));
smile.position.set(0,2.2,0.68);smile.rotation.z=Math.PI;buddha.add(smile);
const halo=new THREE.Mesh(new THREE.TorusGeometry(1.1,0.07,8,40),new THREE.MeshStandardMaterial({color:0xffdf8a,emissive:0xffc94a,emissiveIntensity:0.6}));
halo.position.set(0,2.5,-0.2);buddha.add(halo);
box(4,0.7,1.4,WOOD,0,0.85,-2.2,hall);
for(const x of [-1.2,-0.4,0.4,1.2])cyl(0.18,0.14,0.16,10,GOLD,x,1.4,-2.2,hall);
const candles=[];
for(const x of [-1.6,1.6]){cyl(0.08,0.12,0.5,8,GOLD,x,1.5,-2.2,hall);const f=sph(0.08,8,0xffd76a,x,1.85,-2.2,hall);candles.push(f);const l=new THREE.PointLight(0xffaa44,0.5,3);l.position.set(x,1.9,-2.2);hall.add(l);}
for(let i=0;i<3;i++)cyl(0.7,0.8,0.2,16,0xd85a3a,0,0.1,1.5+i*1.2,hall);

/* ================= 求签房 ================= */
const qianHouse=houseWithDoor(8,8,3.5,CREAM,2.8,2.8,-18,4,'求签房',RED);

const npcs=[];
function buildHead(g,skin,opts={}){
  const head=sph(0.4,24,skin,0,1.5,0,g);head.scale.set(1,1.05,1);
  for(const dx of [-1,1]){const ear=sph(0.08,10,skin,dx*0.4,1.5,0,g);ear.scale.set(0.6,1,0.5);}
  for(const dx of [-0.15,0.15]){const brow=box(0.12,0.035,0.03,opts.browColor||0x3a2210,dx,1.62,0.35,g);if(opts.browAngle)brow.rotation.z=dx>0?-opts.browAngle:opts.browAngle;}
  if(opts.closed){for(const dx of [-0.15,0.15])box(0.13,0.025,0.025,DARK,dx,1.52,0.35,g);}
  else{for(const dx of [-0.15,0.15]){sph(0.055,10,0xffffff,dx,1.53,0.34,g).scale.set(1,1.1,0.5);sph(0.035,8,DARK,dx,1.53,0.37,g);sph(0.012,6,0xffffff,dx+0.012,1.55,0.39,g);}}
  sph(0.045,8,opts.noseColor||0xe8b878,0,1.45,0.4,g);
  const sm=new THREE.Mesh(new THREE.TorusGeometry(0.075,0.018,6,12,Math.PI),mat(opts.mouthColor||0x8a3a2a));
  sm.position.set(0,1.36,0.37);sm.rotation.z=Math.PI;g.add(sm);
  for(const dx of [-1,1]){const bl=sph(0.06,8,0xf08a6b,dx*0.24,1.4,0.32,g);bl.material.transparent=true;bl.material.opacity=0.5;bl.scale.set(1,0.7,0.4);}
}
function makeMonk(x,z,rotY,opts={}){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotY;scene.add(g);
  const robeColor=opts.robe||0xd8621e;g.scale.setScalar(opts.scale||1);
  if(opts.pose!=='sit'){for(const dx of [-0.15,0.15]){const f=sph(0.13,10,0x5a3218,dx,0.1,0.05,g);f.scale.set(1,0.6,1.4);}}
  const body=sph(0.5,20,robeColor,0,0.75,0,g);body.scale.set(1,1.15,0.95);
  const shoulders=sph(0.52,18,robeColor,0,1.05,0,g);shoulders.scale.set(1.1,0.4,1);
  box(0.65,0.12,0.06,0xf2c96b,0,0.92,0.47,g).rotation.z=0.32;
  box(0.65,0.12,0.06,0xf2c96b,0,0.74,0.47,g).rotation.z=0.32;
  for(let i=0;i<14;i++){const a=i/14*Math.PI*2;const bead=sph(0.055,10,0x6a3a1a,Math.cos(a)*0.34,0.92+Math.sin(a)*0.14,Math.sin(a)*0.25+0.28,g);bead.material.roughness=0.4;}
  buildHead(g,SKIN,{closed:opts.eyes==='closed'});
  if(opts.jieba!==false){for(let i=0;i<6;i++){const a=i/6*Math.PI*2;sph(0.025,6,0x8a5a2a,Math.cos(a)*0.12,1.88,Math.sin(a)*0.12,g);}}
  if(opts.beard){const beard=sph(0.22,12,0xf0f0f0,0,1.25,0.34,g);beard.scale.set(1,1.3,0.5);}
  if(opts.hat){const hat=new THREE.Mesh(new THREE.ConeGeometry(0.55,0.3,12),mat(0xd99a3a));hat.position.set(0,1.9,0);hat.castShadow=true;g.add(hat);}
  if(opts.pose==='pray'){const hands=sph(0.17,12,SKIN,0,0.85,0.42,g);hands.scale.set(1.2,1.5,0.6);}
  else if(opts.pose==='sweep'){const b=new THREE.Group();b.position.set(0.5,0.5,0.3);b.rotation.z=-0.4;g.add(b);cyl(0.03,0.03,1.4,6,0x8a6a3a,0,0,0,b);box(0.3,0.4,0.15,0xd99a3a,0,-0.8,0,b);}
  else if(opts.pose==='sit'){const l=sph(0.6,16,robeColor,0,0.25,0,g);l.scale.set(1.3,0.4,1);for(const dx of [-0.35,0.35])sph(0.14,10,SKIN,dx,0.45,0.35,g);}
  const data={group:g,pos:new THREE.Vector3(x,0,z),name:opts.name||'小和尚',walk:opts.walk||null,walkT:Math.random()*6,isDiviner:opts.isDiviner||false};
  npcs.push(data);return data;
}
function makeWorshipper(x,z,rotY,opts={}){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rotY;scene.add(g);
  const c=opts.color||0x3a7bd5;g.scale.setScalar(opts.scale||1);
  for(const dx of [-0.13,0.13]){const f=sph(0.11,10,0x3a2210,dx,0.1,0.05,g);f.scale.set(1,0.6,1.3);}
  const body=sph(0.45,20,c,0,0.72,0,g);body.scale.set(1,1.15,0.95);
  const shoulders=sph(0.46,18,c,0,1.0,0,g);shoulders.scale.set(1.1,0.4,1);
  box(0.5,0.1,0.05,0xffffff,0,0.9,0.43,g);box(0.6,0.08,0.5,0x3a2210,0,0.6,0,g).scale.set(1,1,0.6);
  for(const dx of [-1,1]){const arm=cyl(0.1,0.12,0.5,10,c,dx*0.42,0.85,0.05,g);arm.rotation.z=dx*0.2;sph(0.1,10,SKIN,dx*0.5,0.6,0.05,g);}
  buildHead(g,SKIN,{});
  if(opts.hair==='bun'){const hair=sph(0.41,18,0x2a1a10,0,1.56,-0.05,g);hair.scale.set(1,0.9,1);sph(0.15,10,0x2a1a10,0,1.9,-0.05,g);}
  else if(opts.hair==='turban'){const turban=sph(0.44,18,opts.turbanColor||0x8a4a8a,0,1.65,-0.05,g);turban.scale.set(1,0.75,1);}
  else if(opts.hair==='braid'){const hair=sph(0.41,18,0x2a1a10,0,1.56,-0.05,g);hair.scale.set(1,0.9,1);cyl(0.06,0.04,0.5,6,0x2a1a10,0,1.2,-0.35,g);for(let i=0;i<3;i++)sph(0.07,8,0xd84a3a,0,1.35-i*0.15,-0.35,g);}
  else{const hair=sph(0.41,18,0x2a1a10,0,1.56,-0.05,g);hair.scale.set(1,0.9,1);}
  if(opts.pose==='pray'){const h=sph(0.13,12,SKIN,0,0.9,0.4,g);h.scale.set(1.1,1.4,0.5);}
  const data={group:g,pos:new THREE.Vector3(x,0,z),name:opts.name||'香客',walk:opts.walk||null,walkT:Math.random()*6};
  npcs.push(data);return data;
}

function updateJoy(t){
  const r=joyEl.getBoundingClientRect();
  let dx=t.clientX-(r.left+r.width/2),dy=t.clientY-(r.top+r.height/2);
  const max=r.width/2-18,len=Math.hypot(dx,dy);
  if(len>max){dx=dx/len*max;dy=dy/len*max;}
  stickEl.style.transform=`translate(${dx}px,${dy}px)`;
  joyX=dx/max;joyY=dy/max;
}

let actx=null;
function getCtx(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx;}
function playDong(){const c=getCtx(),t=c.currentTime;const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.setValueAtTime(300,t);o.frequency.exponentialRampToValueAtTime(80,t+0.2);g.gain.setValueAtTime(0.3,t);g.gain.exponentialRampToValueAtTime(0.001,t+0.3);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+0.32);}
function playChime(){const c=getCtx(),t=c.currentTime;[660,880,1320].forEach((f,i)=>{const o=c.createOscillator(),g=c.createGain();o.type='sine';o.frequency.value=f;g.gain.setValueAtTime(0.12,t+i*0.07);g.gain.exponentialRampToValueAtTime(0.001,t+i*0.07+0.5);o.connect(g);g.connect(c.destination);o.start(t+i*0.07);o.stop(t+i*0.07+0.6);});}

/* ================= 建筑透明 ================= */
function updateBuildingsTransparency(){
  for(const b of buildings){
    const dx=Math.abs(state.pos.x-b.cx),dz=Math.abs(state.pos.z-b.cz);
    const inside=dx<b.rx&&dz<b.rz;
    if(inside!==b.transparent){
      b.transparent=inside;
      const opacity=inside?0.22:1;
      for(const m of b.walls){m.material.transparent=inside;m.material.opacity=opacity;m.material.depthWrite=!inside;m.material.needsUpdate=true;}
      for(const m of b.roofs){m.material.transparent=inside;m.material.opacity=opacity;m.material.depthWrite=!inside;m.material.needsUpdate=true;}
    }
  }
}

/* ================= 主循环 ================= */
const clock=new THREE.Clock();
let walkAccum=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  const t=clock.elapsedTime;
  let mx=0,mz=0;
  if(joyActive){mx=joyX;mz=joyY;}
  if(keys['KeyW'])mz-=1;if(keys['KeyS'])mz+=1;if(keys['KeyA'])mx-=1;if(keys['KeyD'])mx+=1;
  const ml=Math.hypot(mx,mz);
  if(ml>1){mx/=ml;mz/=ml;}
  state.moving=ml>0.15;
  const camF=new THREE.Vector3(-Math.sin(state.camYaw),0,-Math.cos(state.camYaw));
  const camR=new THREE.Vector3(Math.cos(state.camYaw),0,-Math.sin(state.camYaw));
  const mv=new THREE.Vector3().addScaledVector(camR,mx).addScaledVector(camF,-mz);
  if(mv.lengthSq()>0.001){
    mv.normalize();
    const step=state.speed*dt;
    state.pos.x+=mv.x*step;state.pos.z+=mv.z*step;
    state.yaw=Math.atan2(mv.x,mv.z);
    walkAccum+=step;
    if(walkAccum>2){taskProgress('walk',Math.floor(walkAccum));walkAccum-=Math.floor(walkAccum);}
  }
  state.pos.x=Math.max(-25,Math.min(25,state.pos.x));
  state.pos.z=Math.max(-29,Math.min(31,state.pos.z));
  const pd=Math.hypot(state.pos.x-16,state.pos.z-8);
  if(pd<4.3){const a=Math.atan2(state.pos.z-8,state.pos.x-16);state.pos.x=16+Math.cos(a)*4.3;state.pos.z=8+Math.sin(a)*4.3;}
  const rects=[
    {x1:-8,x2:8,z1:-8,z2:-7.6,pushZ:true},
    {x1:-8.2,x2:-7.8,z1:-8,z2:4,pushX:true},
    {x1:7.8,x2:8.2,z1:-8,z2:4,pushX:true},
    {x1:-22,x2:-14,z1:0,z2:0.4,pushZ:true},
    {x1:-22.2,x2:-21.8,z1:0,z2:8,pushX:true},
    {x1:-14.2,x2:-13.8,z1:0,z2:8,pushX:true},
  ];
  for(const r of rects){
    if(state.pos.x>r.x1&&state.pos.x<r.x2&&state.pos.z>r.z1&&state.pos.z<r.z2){
      if(r.pushZ){const a=Math.abs(state.pos.z-r.z1),b=Math.abs(state.pos.z-r.z2);state.pos.z=a<b?r.z1-0.05:r.z2+0.05;}
      if(r.pushX){const a=Math.abs(state.pos.x-r.x1),b=Math.abs(state.pos.x-r.x2);state.pos.x=a<b?r.x1-0.05:r.x2+0.05;}
    }
  }
  player.position.set(state.pos.x,0,state.pos.z);
  player.rotation.y=state.yaw;
  if(state.moving){state.walkT+=dt*12;player.position.y=Math.abs(Math.sin(state.walkT))*0.09;player.rotation.z=Math.sin(state.walkT)*0.07;}
  else{state.walkT=0;player.position.y=0;player.rotation.z=0;}
  const camTarget=new THREE.Vector3(state.pos.x,1.4,state.pos.z);
  const camOff=new THREE.Vector3(Math.sin(state.camYaw)*Math.cos(state.camPitch),Math.sin(state.camPitch),Math.cos(state.camYaw)*Math.cos(state.camPitch)).multiplyScalar(state.camDist);
  camera.position.lerp(camTarget.clone().add(camOff),0.22);
  camera.lookAt(camTarget);
  for(const n of npcs){
    if(n.walk){
      n.walkT+=dt;
      const k=(Math.sin(n.walkT*n.walk.speed*0.5)+1)/2;
      const gx=n.walk.x1+(n.walk.x2-n.walk.x1)*k;
      const gz=n.walk.z1+(n.walk.z2-n.walk.z1)*k;
      const dir=new THREE.Vector3(n.walk.x2-n.walk.x1,0,n.walk.z2-n.walk.z1).normalize();
      n.group.position.set(gx,0,gz);
      n.group.rotation.y=Math.atan2(dir.x,dir.z);
      n.pos.set(gx,0,gz);
      n.group.position.y=Math.abs(Math.sin(n.walkT*8))*0.05;
    }
  }
  for(let i=0;i<incenseLights.length;i++)incenseLights[i].intensity=0.22+Math.sin(t*6+i)*0.1+Math.random()*0.06;
  for(const c of candles)c.scale.setScalar(1+Math.sin(t*8+Math.random())*0.1);
  for(const l of lanterns)l.obj.rotation.z=Math.sin(t*1.2+l.phase)*0.07;
  halo.rotation.z=t*0.4;
  updateBuildingsTransparency();
  updateInteraction();
  drawMap();
  document.getElementById('mapLabel').textContent=currentZone();
  renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
let lp=0;const loadBar=document.getElementById('loadBar');
const lt=setInterval(()=>{lp+=12;loadBar.style.width=Math.min(lp,100)+'%';if(lp>=100){clearInterval(lt);setTimeout(()=>document.getElementById('loading').classList.add('hide'),300);}},120);
updateRobe();
animate();
document.body.addEventListener('touchstart',()=>getCtx(),{once:true});
</script>
</body>
